[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsec-rag"
version = "1.0.0"
description = "Grounded LLM & RAG Engine for Multi-Cloud Security, Anti-Hallucination, and Automated Patching"
authors = [
  { name = "Manish Pundlik Patil", email = "manishpatiljnec05@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.5.0",
  "python-dotenv>=1.0.0",
  "click>=8.1.0",
  "PyYAML>=6.0.0",
  "jinja2>=3.1.2",
  "requests>=2.31.0",
  "colorama>=0.4.6"
]

[project.scripts]
cloudsec = "cloudsec_rag.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
